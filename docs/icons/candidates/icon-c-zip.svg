<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>WSNP Viewer icon, option C: layered snapshots with a zipper</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- earlier snapshots, stacked behind -->
  <rect x="82" y="102" width="262" height="222" rx="26" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="14"/>
  <rect x="116" y="136" width="262" height="222" rx="26" fill="none" stroke="#22D3EE" stroke-opacity=".75" stroke-width="14"/>
  <!-- the saved page, closed with a zipper (the .wsnp is a ZIP) -->
  <rect x="150" y="170" width="262" height="222" rx="26" fill="#FFFFFF"/>
  <path d="M150 196a26 26 0 0 1 26-26h210a26 26 0 0 1 26 26v22H150z" fill="#E2E8F0"/>
  <circle cx="182" cy="194" r="8" fill="#F87171"/>
  <circle cx="206" cy="194" r="8" fill="#FBBF24"/>
  <circle cx="230" cy="194" r="8" fill="#34D399"/>
  <line x1="281" y1="228" x2="281" y2="312" stroke="#F97316" stroke-width="12" stroke-dasharray="16 10"/>
  <rect x="259" y="312" width="44" height="60" rx="14" fill="#F97316"/>
  <circle cx="281" cy="344" r="9" fill="#FFFFFF"/>
</svg>
