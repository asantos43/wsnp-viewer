<!doctype html><meta charset="utf-8"><title>WSNP Viewer icon options</title>
<style>
  body{margin:0;padding:28px;background:#1e1e1e;color:#ccc;font:14px system-ui,sans-serif}
  h1{font-size:18px;margin:0 0 20px;color:#fff}
  .row{display:flex;gap:28px}
  .card{flex:1;background:#252526;border-radius:10px;padding:18px}
  .card h2{font-size:14px;margin:0 0 12px;color:#fff}
  .big{display:block;margin:0 auto 14px}
  .sizes{display:flex;align-items:flex-end;gap:14px;padding:12px;border-radius:8px}
  .dark{background:#1e1e1e}.light{background:#f3f3f3;margin-top:8px}
  .sizes span{font-size:11px;color:#888}.light span{color:#555}
  figure{margin:0;text-align:center}
</style>
<h1>WSNP Viewer: icon options (A, B, C)</h1>
<div class="row">
  <div class="card"><h2>A: viewfinder</h2>
    <img class="big" src="icon-a-viewfinder.svg" width="256" height="256">
    <div class="sizes dark"><figure><img src="icon-a-viewfinder.svg" width="64"><br><span>64</span></figure><figure><img src="icon-a-viewfinder.svg" width="32"><br><span>32</span></figure><figure><img src="icon-a-viewfinder.svg" width="16"><br><span>16</span></figure></div>
    <div class="sizes light"><figure><img src="icon-a-viewfinder.svg" width="64"><br><span>64</span></figure><figure><img src="icon-a-viewfinder.svg" width="32"><br><span>32</span></figure><figure><img src="icon-a-viewfinder.svg" width="16"><br><span>16</span></figure></div></div>
  <div class="card"><h2>B: page and lens</h2>
    <img class="big" src="icon-b-lens.svg" width="256" height="256">
    <div class="sizes dark"><figure><img src="icon-b-lens.svg" width="64"><br><span>64</span></figure><figure><img src="icon-b-lens.svg" width="32"><br><span>32</span></figure><figure><img src="icon-b-lens.svg" width="16"><br><span>16</span></figure></div>
    <div class="sizes light"><figure><img src="icon-b-lens.svg" width="64"><br><span>64</span></figure><figure><img src="icon-b-lens.svg" width="32"><br><span>32</span></figure><figure><img src="icon-b-lens.svg" width="16"><br><span>16</span></figure></div></div>
  <div class="card"><h2>C: layers and zipper</h2>
    <img class="big" src="icon-c-zip.svg" width="256" height="256">
    <div class="sizes dark"><figure><img src="icon-c-zip.svg" width="64"><br><span>64</span></figure><figure><img src="icon-c-zip.svg" width="32"><br><span>32</span></figure><figure><img src="icon-c-zip.svg" width="16"><br><span>16</span></figure></div>
    <div class="sizes light"><figure><img src="icon-c-zip.svg" width="64"><br><span>64</span></figure><figure><img src="icon-c-zip.svg" width="32"><br><span>32</span></figure><figure><img src="icon-c-zip.svg" width="16"><br><span>16</span></figure></div></div>
</div>
