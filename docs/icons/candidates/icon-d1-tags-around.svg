<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>WSNP Viewer icon, option D1: the page between an opening and a closing tag</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the page: a browser window -->
  <rect x="134" y="140" width="244" height="224" rx="26" fill="#FFFFFF"/>
  <path d="M134 166a26 26 0 0 1 26-26h192a26 26 0 0 1 26 26v22H134z" fill="#E0E7FF"/>
  <circle cx="162" cy="164" r="8" fill="#F87171"/>
  <circle cx="184" cy="164" r="8" fill="#FBBF24"/>
  <circle cx="206" cy="164" r="8" fill="#34D399"/>
  <rect x="158" y="212" width="112" height="14" rx="7" fill="#A5B4FC"/>
  <rect x="158" y="240" width="196" height="12" rx="6" fill="#C7D2FE"/>
  <rect x="158" y="262" width="196" height="12" rx="6" fill="#C7D2FE"/>
  <rect x="158" y="284" width="140" height="12" rx="6" fill="#C7D2FE"/>
  <!-- the tags around it: < page > -->
  <g fill="none" stroke="#FBBF24" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 178L46 238l58 60"/>
    <path d="M408 178l58 60-58 60"/>
  </g>
  <!-- the snapshot: a camera lens on the corner -->
  <circle cx="364" cy="368" r="70" fill="#0B3B37" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="364" cy="368" r="38" fill="#14B8A6"/>
  <circle cx="364" cy="368" r="16" fill="#0B3B37"/>
  <circle cx="348" cy="351" r="8" fill="#FFFFFF"/>
</svg>
